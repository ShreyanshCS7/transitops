<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TransitOps — Smart Transport Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark">◆</span>
      <div>
        <div class="brand-name">TransitOps</div>
        <div class="brand-tag">Smart Transport Operations Platform</div>
      </div>
    </div>
    <form id="login-form">
      <label>Email
        <input type="email" id="login-email" required placeholder="you@transitops.com" autocomplete="username" />
      </label>
      <label>Password
        <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password" />
      </label>
      <div id="login-error" class="form-error" hidden></div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <div class="demo-accounts">
      <div class="demo-title">Demo accounts <span class="demo-pw">password: Password123!</span></div>
      <div class="demo-grid">
        <button class="demo-chip" data-email="fleetmanager@transitops.com">Fleet Manager</button>
        <button class="demo-chip" data-email="driver@transitops.com">Driver</button>
        <button class="demo-chip" data-email="safety@transitops.com">Safety Officer</button>
        <button class="demo-chip" data-email="finance@transitops.com">Financial Analyst</button>
      </div>
    </div>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">TransitOps</span>
    </div>
    <nav class="nav" id="nav-links">
      <button class="nav-link" data-view="dashboard">Dashboard</button>
      <button class="nav-link" data-view="vehicles">Vehicle Registry</button>
      <button class="nav-link" data-view="drivers">Drivers</button>
      <button class="nav-link" data-view="trips">Trips</button>
      <button class="nav-link" data-view="maintenance">Maintenance</button>
      <button class="nav-link" data-view="fuel">Fuel &amp; Expenses</button>
      <button class="nav-link" data-view="reports">Reports</button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">?</div>
        <div>
          <div class="user-name" id="user-name">—</div>
          <div class="user-role" id="user-role">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-block" id="logout-btn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="topbar-eyebrow" id="view-eyebrow">Overview</div>
        <h1 class="topbar-title" id="view-title">Dashboard</h1>
      </div>
      <div class="topbar-clock" id="topbar-clock"></div>
    </header>
    <div class="view-container" id="view-container">
      <!-- dynamic view content -->
    </div>
  </main>
</div>

<div id="toast-root" class="toast-root"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
